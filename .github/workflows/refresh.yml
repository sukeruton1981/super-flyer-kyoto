name: Refresh flyer prices
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
      - run: TZ=Asia/Tokyo python scripts/import_verified.py    
      - run: TZ=Asia/Tokyo python scripts/update.py
      - run: TZ=Asia/Tokyo python scripts/check_sources.py
      - run: TZ=Asia/Tokyo python scripts/discover_flyers.py
      - run: TZ=Asia/Tokyo python scripts/build_flyer_review.py
      - run: TZ=Asia/Tokyo python scripts/scan_flyer_layout.py --max-images 2
      - run: TZ=Asia/Tokyo python scripts/build_product_candidates.py 
      - name: Commit updated files
        run: |
          git config user.name 'flyer-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/flyer_review_queue.json flyer_review.html data/discovered_flyers.json data/source_health.json index.html data/price_history.json data/update_status.json data/flyer_ocr_review.json flyer_ocr_review.html data/product_candidates_review.json product_candidates_review.htmlif ! git diff --cached --quiet; then
            git commit -m "Daily flyer verification"
            git pull --rebase origin main
            git push
          fi
