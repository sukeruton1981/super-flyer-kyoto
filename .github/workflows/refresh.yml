name: Refresh flyer prices
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: TZ=Asia/Tokyo python scripts/import_verified.py    
      - run: TZ=Asia/Tokyo python scripts/update.py
      - run: TZ=Asia/Tokyo python scripts/check_sources.py
      - name: Commit updated files
        run: |
          git config user.name 'flyer-update-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/source_health.json index.html data/price_history.json data/update_status.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Daily flyer verification"
            git push
          fi
